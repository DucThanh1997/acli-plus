# Build acli-plus for all platforms and publish a GitLab Release on every tag.
# Tag convention: v<version>, e.g. `git tag v0.1.0 && git push origin v0.1.0`.
#
# The release exposes permanent asset links so install.sh can fetch:
#   <project>/-/releases/v<version>/downloads/acli-plus_<os>_<arch>

stages:
  - test
  - build
  - release

test:
  stage: test
  image: golang:1.26
  script:
    - go vet ./...
    - go test ./...
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

build:
  stage: build
  image: golang:1.26
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - VERSION="${CI_COMMIT_TAG#v}" bash scripts/build.sh
    - |
      for file in dist/acli-plus_*; do
        name=$(basename "$file")
        echo "uploading $name to the generic package registry"
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$file" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/acli-plus/${CI_COMMIT_TAG#v}/${name}"
      done
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - |
      ver="${CI_COMMIT_TAG#v}"
      links=""
      for asset in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64 windows_amd64.exe; do
        name="acli-plus_${asset}"
        url="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/acli-plus/${ver}/${name}"
        # filepath makes a permanent link at <project>/-/releases/<tag>/downloads/<name>
        links="${links} --assets-link {\"name\":\"${name}\",\"url\":\"${url}\",\"filepath\":\"/${name}\",\"link_type\":\"package\"}"
      done
      # shellcheck disable=SC2086
      release-cli create \
        --name "acli-plus ${CI_COMMIT_TAG}" \
        --tag-name "${CI_COMMIT_TAG}" \
        --description "acli-plus ${CI_COMMIT_TAG}" \
        ${links}
